name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Inject API Key into Code
      run: |
        sed -i 's/YOUR_GEMINI_API_KEY/${{ secrets.GEMINI_API_KEY }}/g' app/src/main/java/com/nexora/brain/provider/GeminiAIProvider.kt

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: nexora-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk